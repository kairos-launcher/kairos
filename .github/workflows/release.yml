name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Release builds update themselves from these releases (src/builtin/update).
  KAIROS_UPDATE_CHANNEL: github

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: bash scripts/dist.sh
      - name: Package
        run: |
          # Version-free names, so releases/latest/download/<file> always points at the newest.
          mkdir -p kairos
          cp -r dist/. kairos/
          tar czf kairos-linux-x86_64.tar.gz kairos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: linux, path: "*.tar.gz" }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and stage
        shell: bash
        run: bash scripts/dist.sh
      - name: Installer
        shell: bash
        run: |
          v=${GITHUB_REF_NAME:-0.0.0}
          iscc "//DAppVersion=${v#v}" packaging/kairos.iss
          mv dist-installer/*.exe .
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item dist/portable -ItemType File
          Compress-Archive -Path dist/* -DestinationPath kairos-windows-x86_64-portable.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            *.zip
            kairos-setup.exe

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: out, merge-multiple: true }
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS
      - if: ${{ !github.event.repository.private }} # not available for private repos on the Free plan
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: "out/*" }
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with: { files: "out/*" }
