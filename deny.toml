# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained (not vulnerable) transitive crates with no upgrade path yet.
# Re-check when Slint, winit or ksni move on.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via winit -> sctk-adwaita; fixed when winit drops it" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus 5 (Slint, ksni); merged into zbus 6" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus 5 (Slint, ksni); merged into zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus 5 (Slint, ksni); merged into zbus 6" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils via Slint's spin_on (renderer, build, macros); no maintained alternative upstream" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # Slint is GPL-3.0-only OR royalty-free (with attribution, see README) OR commercial.
    # The launcher uses it under the royalty-free license.
    "LicenseRef-Slint-Royalty-free-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The vendored softbuffer patch is a path dependency.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
