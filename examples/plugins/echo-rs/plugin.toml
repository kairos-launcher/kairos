id = "echo-rs"
name = "Echo (Rust)"
version = "0.1.0"
description = "Reference plugin in Rust. Build it first: cargo build --release, then copy the binary next to this file."

[run]
mode = "on-demand"
idle_timeout_s = 30

[run.exec]
windows = ["./echo-rs.exe"]
linux = ["./echo-rs"]
macos = ["./echo-rs"]

[query]
triggers = ["echors "]
global = false
timeout_ms = 500
