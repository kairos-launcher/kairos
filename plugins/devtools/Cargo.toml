[package]
name = "devtools"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Developer utilities plugin for the launcher (JSON-RPC stdio)."

[[bin]]
name = "kairos-devtools"
path = "src/main.rs"

[dependencies]
serde_json = "1"
base64 = "0.23"
getrandom = "0.4"
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"

[build-dependencies]
winresource = { version = "0.1", default-features = false }

# Built on its own, not as part of the launcher's crate.
[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
