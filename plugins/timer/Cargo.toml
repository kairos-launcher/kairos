[package]
name = "timer"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Timer and alarm plugin for the launcher (JSON-RPC stdio)."

[[bin]]
name = "kairos-timer"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local time and time zones (on Windows too) for alarms at a clock time.
jiff = "0.2"

[build-dependencies]
winresource = { version = "0.1", default-features = false }

[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
