id = "timer"
name = "Timer"
version = "0.1.0"
description = "Timers and alarms with a desktop notification: `timer 10m tea`, `timer 1h30`, `timer 14:30 standup`."

[run]
mode = "on-demand"
idle_timeout_s = 30

[run.exec]
windows = ["./kairos-timer.exe"]
linux = ["./kairos-timer"]
macos = ["./kairos-timer"]

[query]
triggers = ["timer "]
global = false
timeout_ms = 150

[[settings]]
key = "default_unit"
type = "choice"
label = "Unit for a bare number"
description = "what `timer 25` means"
options = ["min", "s"]
default = "min"

[[settings]]
key = "sound"
type = "bool"
label = "Play a sound"
description = "when a timer ends"
default = true

[[settings]]
key = "sticky"
type = "bool"
label = "Keep the notification"
description = "until you dismiss it, instead of letting it time out"
default = true
